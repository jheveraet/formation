<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur de ROI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  .subtitle { color: #94a3b8; font-size: .85rem; margin-bottom: 20px; }
  label { display: block; font-size: .85rem; margin: 14px 0 6px; color: #cbd5e1; }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 1rem;
  }
  input:focus { outline: none; border-color: #38bdf8; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .results { margin-top: 22px; display: grid; gap: 10px; }
  .result {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0f172a;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: .95rem;
  }
  .result .value { font-weight: 700; font-variant-numeric: tabular-nums; }
  .result.main {
    background: linear-gradient(135deg, #0369a1, #0e7490);
  }
  .result.main .value { font-size: 1.4rem; }
  .positive { color: #4ade80; }
  .negative { color: #f87171; }
  .note { margin-top: 16px; font-size: .75rem; color: #64748b; text-align: center; }
</style>
</head>
<body>
<main class="card">
  <h1>Calculateur de ROI</h1>
  <p class="subtitle">Retour sur investissement, calculé en local.</p>

  <label for="investissement">Investissement initial (€)</label>
  <input type="number" id="investissement" value="10000" min="0" step="any">

  <div class="row">
    <div>
      <label for="gains">Gains (€)</label>
      <input type="number" id="gains" value="15000" min="0" step="any">
    </div>
    <div>
      <label for="periode">Période (mois)</label>
      <input type="number" id="periode" value="12" min="1" step="1">
    </div>
  </div>

  <section class="results">
    <div class="result main">
      <span>ROI</span>
      <span class="value" id="roi">—</span>
    </div>
    <div class="result">
      <span>Profit net</span>
      <span class="value" id="profit">—</span>
    </div>
    <div class="result">
      <span>Gain mensuel moyen</span>
      <span class="value" id="mensuel">—</span>
    </div>
    <div class="result">
      <span>Retour sur investissement dans</span>
      <span class="value" id="payback">—</span>
    </div>
  </section>

  <p class="note">ROI = (Gains − Investissement) / Investissement × 100</p>
</main>

<script>
(function () {
  const els = {
    investissement: document.getElementById('investissement'),
    gains: document.getElementById('gains'),
    periode: document.getElementById('periode'),
    roi: document.getElementById('roi'),
    profit: document.getElementById('profit'),
    mensuel: document.getElementById('mensuel'),
    payback: document.getElementById('payback')
  };

  const fmtEuro = new Intl.NumberFormat('fr-FR', {
    style: 'currency', currency: 'EUR', maximumFractionDigits: 0
  });
  const fmtPct = new Intl.NumberFormat('fr-FR', {
    style: 'percent', maximumFractionDigits: 1
  });

  function readNumber(el) {
    const n = parseFloat(el.value);
    return Number.isFinite(n) ? n : null;
  }

  function compute() {
    const invest = readNumber(els.investissement);
    const gains = readNumber(els.gains);
    const periode = readNumber(els.periode);

    if (invest === null || gains === null || invest <= 0) {
      setResults(null);
      return;
    }

    const profit = gains - invest;
    const roi = profit / invest;
    const p = periode && periode > 0 ? periode : null;

    els.roi.textContent = fmtPct.format(roi);
    els.roi.className = 'value ' + (roi >= 0 ? 'positive' : 'negative');
    els.profit.textContent = fmtEuro.format(profit);
    els.profit.className = 'value ' + (profit >= 0 ? 'positive' : 'negative');
    els.mensuel.textContent = p ? fmtEuro.format(profit / p) : '—';

    if (profit >= 0 && p && gains > 0) {
      const paybackMois = (invest / (gains / p)).toFixed(1);
      els.payback.textContent = paybackMois + ' mois';
    } else if (profit < 0) {
      els.payback.textContent = 'jamais (perte)';
    } else {
      els.payback.textContent = '—';
    }
  }

  function setResults(value) {
    els.roi.textContent = value === null ? '—' : value;
    els.profit.textContent = '—';
    els.mensuel.textContent = '—';
    els.payback.textContent = '—';
  }

  Object.values(els).forEach(el => {
    if (el.tagName === 'INPUT') {
      el.addEventListener('input', compute);
    }
  });

  compute();
})();
</script>
</body>
</html>
